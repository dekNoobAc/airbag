[package]
name = "airbag-oracle"
description = "Airbag's oracle: runs inside OutLayer's TEE, reads Polymarket (or a price feed), prints one report"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "airbag-oracle"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
